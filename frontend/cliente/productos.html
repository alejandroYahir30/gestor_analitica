<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Café Nébula | Productos</title>

    <!-- ESTILOS -->

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/cliente.css"
    >

    <link
        rel="stylesheet"
        href="../css/productos.css"
    >

</head>

<body>

    <!-- NAVBAR -->

    <header class="header">

        <div class="header-contenido">

            <a
                href="productos.html"
                class="logo"
            >
                Café Nébula
            </a>

            <nav>

                <a href="productos.html">
                    Productos
                </a>

                <a
                    href="carrito.html"
                    class="link-carrito"
                    aria-label="Carrito"
                >

                    <span class="icono-carrito">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 8H6"
                            />

                            <circle
                                cx="10"
                                cy="20"
                                r="1.2"
                            />

                            <circle
                                cx="18"
                                cy="20"
                                r="1.2"
                            />

                        </svg>

                        <span
                            id="contador-carrito"
                            class="contador-carrito"
                        >
                            0
                        </span>

                    </span>

                </a>

            </nav>

        </div>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="contenedor">

        <section class="presentacion">

            <p class="etiqueta">
                CAFETERÍA LOCAL
            </p>

            <h1>
                Productos
            </h1>

            <p>
                Selecciona los productos que deseas agregar a tu pedido.
            </p>

        </section>


        <!-- PRODUCTOS -->

        <section>

            <div
                id="productos"
                class="productos-grid"
            >

                <p>
                    Cargando productos...
                </p>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="../js/notificaciones.js"></script>
    <script src="../js/cliente.js"></script>

</body>

</html>
