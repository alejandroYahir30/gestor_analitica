<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Café Nébula | Pedidos</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <link
        rel="stylesheet"
        href="../css/pedidos.css"
    >

</head>

<body>

    <header class="header">

        <div class="logo">
            Café Nébula
        </div>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                href="pedidos.html"
                class="activo"
            >
                Pedidos
            </a>

            <a href="inventario.html">
                Inventario
            </a>

            <a href="ventas.html">
                Ventas
            </a>

        </nav>

    </header>


    <main class="contenedor">

        <!-- ENCABEZADO -->

        <section class="pedidos-encabezado">

            <div>

                <p class="pedidos-etiqueta">
                    OPERACIÓN
                </p>

                <h1>
                    Pedidos
                </h1>

                <p class="pedidos-descripcion">
                    Administra y da seguimiento a los pedidos
                    realizados por los clientes.
                </p>

            </div>

        </section>


        <!-- RESUMEN -->

        <section class="pedidos-resumen">

            <article class="pedido-resumen-item">

                <div class="resumen-icono resumen-pendiente">
                    !
                </div>

                <div>

                    <span>
                        Pendientes
                    </span>

                    <strong id="contador-pendientes">
                        0
                    </strong>

                </div>

            </article>


            <article class="pedido-resumen-item">

                <div class="resumen-icono resumen-aceptado">
                    ✓
                </div>

                <div>

                    <span>
                        Aceptados
                    </span>

                    <strong id="contador-aceptados">
                        0
                    </strong>

                </div>

            </article>


            <article class="pedido-resumen-item">

                <div class="resumen-icono resumen-preparacion">
                    ◷
                </div>

                <div>

                    <span>
                        En preparación
                    </span>

                    <strong id="contador-preparacion">
                        0
                    </strong>

                </div>

            </article>


            <article class="pedido-resumen-item">

                <div class="resumen-icono resumen-finalizado">
                    ✓
                </div>

                <div>

                    <span>
                        Finalizados
                    </span>

                    <strong id="contador-finalizados">
                        0
                    </strong>

                </div>

            </article>

        </section>


        <!-- LISTADO -->

        <section class="pedidos-panel">

            <div class="pedidos-panel-header">

                <div>

                    <p>
                        REGISTRO
                    </p>

                    <h2>
                        Pedidos recibidos
                    </h2>

                </div>

                <span class="pedidos-total-label">
                    Actualización en tiempo real
                </span>

            </div>


            <div
                id="pedidos"
                class="pedidos-lista"
            >

                <div class="pedidos-cargando">

                    <span></span>

                    <p>
                        Cargando pedidos...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="../js/notificaciones.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/admin-auth.js"></script>
    

</body>

</html>
